# Deltas over bcmrpi_defconfig for the 4-port managed switch HAT. Built in
# rather than =m, so that the front ports exist before any init script runs:
# clixon-backend configures them early in rc5.d, and the image carries no
# module tree (rpi-managed-switch.inc).

# SPI controller and the ENC28J60, the DSA conduit.
CONFIG_SPI_BCM2835=y
CONFIG_ENC28J60=y

# The RTL8367S, managed over bit-banged SMI.
CONFIG_NET_DSA=y
CONFIG_NET_DSA_TAG_RTL8_4=y
CONFIG_NET_DSA_REALTEK=y
CONFIG_NET_DSA_REALTEK_SMI=y
CONFIG_NET_DSA_REALTEK_RTL8365MB=y

# What clixon-switch builds: the ports in a VLAN-aware bridge, routed VLAN
# interfaces on top.
CONFIG_BRIDGE=y
CONFIG_BRIDGE_VLAN_FILTERING=y
CONFIG_VLAN_8021Q=y

# The root filesystem: a squashfs slot with an overlay from the data partition
# (rpi-switch-overlay-init). Both are =m in bcmrpi_defconfig.
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_OVERLAY_FS=y
